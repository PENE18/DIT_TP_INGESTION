version: "3.9"

services:

  # ─────────────────────────────────────────────────────────────
  # SOURCE: PostgreSQL (simule une base opérationnelle)
  # ─────────────────────────────────────────────────────────────
  postgres-source:
    image: postgres:15
    container_name: postgres-source
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - pg_source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d source_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - poc-net

  # ─────────────────────────────────────────────────────────────
  # WAREHOUSE: PostgreSQL (destination finale)
  # ─────────────────────────────────────────────────────────────
  # postgres-warehouse:
  #   image: postgres:15
  #   container_name: postgres-warehouse
  #   environment:
  #     POSTGRES_DB: warehouse_db
  #     POSTGRES_USER: admin
  #     POSTGRES_PASSWORD: admin123
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - ./postgres/warehouse-init:/docker-entrypoint-initdb.d
  #     - pg_warehouse_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U admin -d warehouse_db"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s
  #   networks:
  #     - poc-net

  # ─────────────────────────────────────────────────────────────
  # PGADMIN: interface web pour PostgreSQL source + warehouse
  # ─────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@poc-data.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres-source:
        condition: service_healthy
      # postgres-warehouse:
      #   condition: service_healthy
    networks:
      - poc-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # LAKEHOUSE: MinIO (stockage objet compatible S3)
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poc-net

  # ─────────────────────────────────────────────────────────────
  # INIT MinIO: cree les buckets bronze / silver / gold
  # ─────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Attente MinIO...';
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/bronze --ignore-existing;
      mc mb local/silver --ignore-existing;
      mc mb local/gold   --ignore-existing;
      mc mb local/iceberg --ignore-existing;
      echo 'Buckets crees: bronze, silver, gold, iceberg';
      mc ls local;
      "
    networks:
      - poc-net

