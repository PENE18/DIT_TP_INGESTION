  #     retries: 20
  #     start_period: 120s
  #   networks:
  #     - poc-net

  nifi:
    image: apache/nifi:2.4.0
    container_name: nifi
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=ctsBtRBKHRAx69EqUghvvgEvjnaLjFEB
      - NIFI_SENSITIVE_PROPS_KEY=12345678901234567890123456789012
      - NIFI_JVM_HEAP_INIT=1g
      - NIFI_JVM_HEAP_MAX=2g
      - NIFI_WEB_PROXY_HOST=localhost:8443
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' -k https://localhost:8443/nifi-api/flow/about | grep -qE '^(200|401)$'"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 120s
    volumes:
      - nifi_data:/opt/nifi/nifi-current/conf
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_logs:/opt/nifi/nifi-current/logs
      - ./data:/opt/nifi/data
      - ./nifi/scripts:/opt/nifi/custom-scripts
      - ./nifi/templates:/opt/nifi/nifi-current/conf/templates
      - ./nifi/drivers:/opt/nifi/nifi-current/drivers
    depends_on:
      postgres-source:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - poc-net

  # ─────────────────────────────────────────────────────────────
  # API MOCK: simule une API REST externe (FastAPI)
  # ─────────────────────────────────────────────────────────────
  api-mock:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-mock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - poc-net

